<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام الخدمات</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f8;
      color: #17202a;
    }

    .app {
      max-width: 500px;
      margin: auto;
      min-height: 100vh;
      background: white;
    }

    .header {
      background: #168aad;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    .header h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .content {
      padding: 20px;
    }

    .welcome {
      margin-bottom: 20px;
    }

    .welcome h2 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .welcome p {
      color: #6c757d;
      font-size: 14px;
    }

    .menu {
      display: grid;
      gap: 14px;
    }

    .menu button {
      border: none;
      border-radius: 14px;
      padding: 18px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: #f1f8fa;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>نظام الخدمات</h1>
      <p>مرحباً بك في تطبيق الخدمة</p>
    </div>
    
    <div class="content">
      <div class="welcome">
        <h2>القائمة الرئيسية</h2>
        <p>اختر الخدمة التي تريدها من الأسفل:</p>
      </div>
      
      <div class="menu">
        <button>الخدمة الأولى</button>
        <button>الخدمة الثانية</button>
      </div>
    </div>
  </div>
</body>
</html>
